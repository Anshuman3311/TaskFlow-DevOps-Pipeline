<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TaskFlow</title>
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body>

  <!-- ===== Auth screen ===== -->
  <main id="auth-screen" class="auth-screen">
    <div class="auth-panel">
      <h1 class="wordmark">TaskFlow</h1>
      <p class="tagline">A small task tracker for the pipeline to build, test, and deploy.</p>

      <nav class="auth-tabs" role="tablist">
        <button type="button" class="auth-tab is-active" data-tab="login">Sign in</button>
        <button type="button" class="auth-tab" data-tab="register">Create account</button>
      </nav>

      <form id="login-form" class="auth-form">
        <label for="login-email">Email</label>
        <input id="login-email" type="email" required autocomplete="email" />

        <label for="login-password">Password</label>
        <input id="login-password" type="password" required autocomplete="current-password" />

        <button type="submit" class="btn-primary">Sign in</button>
        <p class="form-error" id="login-error"></p>
      </form>

      <form id="register-form" class="auth-form is-hidden">
        <label for="register-email">Email</label>
        <input id="register-email" type="email" required autocomplete="email" />

        <label for="register-password">Password</label>
        <input id="register-password" type="password" required autocomplete="new-password" minlength="6" />
        <p class="form-hint">At least 6 characters.</p>

        <button type="submit" class="btn-primary">Create account</button>
        <p class="form-error" id="register-error"></p>
      </form>
    </div>
  </main>

  <!-- ===== Dashboard ===== -->
  <main id="dashboard" class="dashboard is-hidden">
    <header class="topbar">
      <span class="wordmark wordmark-small">TaskFlow</span>
      <div class="topbar-right">
        <span id="user-email" class="user-email"></span>
        <button type="button" id="signout-btn" class="btn-ghost">Sign out</button>
      </div>
    </header>

    <section class="content">
      <form id="new-task-form" class="new-task-form">
        <input id="new-task-title" type="text" placeholder="Add a task" required maxlength="120" />
        <button type="submit" class="btn-primary">Add</button>
      </form>

      <div id="task-list" class="task-list" aria-live="polite">
        <!-- tasks injected here -->
      </div>

      <p id="empty-state" class="empty-state is-hidden">
        No tasks yet. Add one above to get started.
      </p>
    </section>
  </main>

  <script src="/js/app.js"></script>
</body>
</html>
