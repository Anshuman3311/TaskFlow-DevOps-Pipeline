services:

  taskflow-api:
    image: ${IMAGE_NAME:-taskflow-api}:${TAG:-latest}
    container_name: taskflow-api-${ENV:-staging}
    ports:
      - "${PORT:-3000}:3000"

    environment:
      NODE_ENV: ${ENV:-staging}
      APP_VERSION: ${APP_VERSION:-1.0.0}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-2h}
      LOG_LEVEL: ${LOG_LEVEL:-info}

    volumes:
      - taskflow-data-${ENV:-staging}:/app/data

    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://localhost:3000/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  prometheus:
    image: prom/prometheus:latest
    container_name: taskflow-prometheus
    ports:
      - "9090:9090"

    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alert-rules.yml:/etc/prometheus/alert-rules.yml:ro
      - prometheus-data:/prometheus

    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-lifecycle"

volumes:
  taskflow-data-staging:
  taskflow-data-production:
  prometheus-data:
