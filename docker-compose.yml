version: "3.9"

services:
  taskflow-api:
    build: .
    image: taskflow-api:${TAG:-latest}
    container_name: taskflow-api-${ENV:-staging}
    ports:
      - "${PORT:-3000}:3000"
    environment:
      - NODE_ENV=${ENV:-staging}
      - JWT_SECRET=${JWT_SECRET:-dev-secret-change-me}
      - JWT_EXPIRES_IN=${JWT_EXPIRES_IN:-2h}
      - LOG_LEVEL=${LOG_LEVEL:-info}
    volumes:
      - taskflow-data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/health', r => process.exit(r.statusCode === 200 ? 0 : 1))"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  taskflow-data:
